name: V2 GitHub public-data smoke (NO trading)

# One test branch only. No schedule, PR trigger, default-branch writes,
# private exchange API, inherited V1 state, or shadow migration.
on:
  push:
    branches: ['codex/v2-github-smoke-20261003']
    paths:
      - 'crypto_trader_v2/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config.v2.example.yaml'
      - 'config.binance-th.paper.yaml'
      - 'config.xau.research.template.json'
      - '.github/workflows/v2-github-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-github-smoke-20261003
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  correctness:
    if: github.repository == 'thanawat123456/crypto-trader' && github.ref == 'refs/heads/codex/v2-github-smoke-20261003' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install V2-only dependencies (not V1 requirements)
        run: python -m pip install 'PyYAML>=6.0,<7' 'numpy>=1.24,<3'
      - name: Run all offline correctness tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Synthetic software demo (NOT profit evidence)
        run: python -B -m crypto_trader_v2 -c config.v2.example.yaml demo --bars 600

  public-data:
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6.0,<7' 'numpy>=1.24,<3'
      - name: Read native BTC/ETH once and audit raw receipts
        run: python -B -m scripts.github_v2_smoke --output "${RUNNER_TEMP}/v2-public-smoke"
      - name: Retain only the new PUBLIC-data smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-public-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/v2-public-smoke/
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
